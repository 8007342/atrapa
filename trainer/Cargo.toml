[package]
name = "atrapa-trainer"
version = "0.1.0"
edition = "2021"
publish = false
description = "Infrastructure proof only: PROVISIONAL toy-grid MLP training smoke (task 6.1 lane check). Not Atrapa game rules and not the project trainer."

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
candle-core = "0.9.1"
candle-nn = "0.9.1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
